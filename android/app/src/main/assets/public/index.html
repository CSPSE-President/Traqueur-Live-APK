<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1f16">
<meta name="color-scheme" content="dark">
<title>Traqueur Live — Bergères</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#171b13;
    --bg-2:#20261a;
    --panel:#232a1c;
    --line:#3a4530;
    --rust:#b5622a;
    --rust-light:#d97f45;
    --olive:#7c8f52;
    --cream:#ece3d1;
    --cream-dim:#a8a190;
    --danger:#c14b3a;
    --ok:#7c9a52;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--cream);color-scheme:dark;
    font-family:'Bahnschrift','Segoe UI',system-ui,sans-serif;overscroll-behavior:none;}
  .mono{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;letter-spacing:.02em;}

  /* topo texture */
  .topo{
    position:fixed;inset:0;pointer-events:none;opacity:.08;z-index:0;
    background-image:
      repeating-radial-gradient(circle at 20% 30%, transparent 0 18px, var(--olive) 18px 19px, transparent 19px 40px),
      repeating-radial-gradient(circle at 80% 75%, transparent 0 26px, var(--olive) 26px 27px, transparent 27px 55px);
  }

  #app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 18px;border-bottom:1px solid var(--line);background:var(--bg-2);
    flex-shrink:0;
  }
  header .brand{display:flex;flex-direction:row;align-items:baseline;gap:8px;line-height:1.1;}
  header .brand .eyebrow{font-size:10px;letter-spacing:.14em;color:var(--rust-light);text-transform:uppercase;}
  header .brand .title{font-size:17px;font-weight:700;color:var(--cream);}
  header .badge{
    font-size:11px;padding:5px 10px;border:1px solid var(--line);border-radius:2px;
    color:var(--cream-dim);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;
  }

  main{flex:1;display:flex;flex-direction:column;min-height:0;}

  /* ---------- Ecran de choix ---------- */
  .select-screen{
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    flex:1;padding:24px;gap:18px;text-align:center;
  }
  .select-screen h1{
    font-size:28px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em;color:var(--cream);
  }
  .select-screen .sub{color:var(--cream-dim);font-size:14px;max-width:340px;margin-bottom:8px;}
  .role-btn{
    width:100%;max-width:340px;padding:20px;border:1px solid var(--line);background:var(--panel)!important;
    border-radius:4px;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s;
    color:var(--cream)!important;font-family:inherit;-webkit-appearance:none;appearance:none;
  }
  .role-btn:active{transform:scale(.98);}
  .role-btn:hover{border-color:var(--rust);}
  .role-btn .rb-eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust-light);margin-bottom:6px;}
  .role-btn .rb-title{font-size:18px;font-weight:700;color:var(--cream);margin-bottom:4px;}
  .role-btn .rb-desc{font-size:13px;color:var(--cream-dim);}

  /* ---------- Mode Traqueur ---------- */
  .tracker-screen{flex:1;display:flex;flex-direction:column;padding:22px;gap:18px;}
  .name-field{display:flex;flex-direction:column;gap:6px;}
  .name-field label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--cream-dim);}
  .name-field input{
    background:var(--panel);border:1px solid var(--line);color:var(--cream);
    padding:12px 14px;border-radius:4px;font-size:16px;
  }
  .name-field input:focus{outline:none;border-color:var(--rust);}

  .status-ring{
    margin:10px auto;width:180px;height:180px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    border:2px solid var(--line);position:relative;
  }
  .status-ring.live{border-color:var(--rust);}
  .status-ring .pulse{
    position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--rust);
    opacity:0;
  }
  .status-ring.live .pulse{animation:pulse 2.2s ease-out infinite;}
  @keyframes pulse{
    0%{transform:scale(.9);opacity:.7;}
    100%{transform:scale(1.35);opacity:0;}
  }
  .status-ring .sr-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--cream-dim);}
  .status-ring .sr-state{font-size:20px;font-weight:800;margin-top:4px;color:var(--cream);}

  .data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;}
  .data-cell{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;}
  .data-cell .dc-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--cream-dim);}
  .data-cell .dc-value{font-size:16px;margin-top:2px;}

  .big-btn{
    padding:18px;border:none;border-radius:4px;font-size:16px;font-weight:800;
    text-transform:uppercase;letter-spacing:.06em;cursor:pointer;
  }
  .big-btn.start{background:var(--rust);color:#1b1206;}
  .big-btn.stop{background:transparent;border:1px solid var(--danger);color:var(--danger);}
  .hint{font-size:12px;color:var(--cream-dim);text-align:center;line-height:1.5;}

  /* ---------- Mode Observateur ---------- */
  .poste-screen{flex:1;display:flex;flex-direction:column;min-height:0;}
  .poste-toolbar{
    display:flex;gap:8px;align-items:center;padding:7px 14px;flex-wrap:wrap;
    background:var(--bg-2);border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .poste-toolbar input{
    flex:1;background:var(--panel);border:1px solid var(--line);color:var(--cream);
    padding:6px 10px;border-radius:4px;font-size:14px;min-width:0;
  }
  .poste-toolbar input:focus{outline:none;border-color:var(--rust);}
  .poste-toolbar input.name-input-empty{
    border-color:var(--danger);
    animation:input-halo-rouge .6s steps(1,end) infinite;
  }
  @keyframes input-halo-rouge{
    0%,49%{ box-shadow:0 0 4px 1px rgba(193,75,58,.5); }
    50%,100%{ box-shadow:0 0 16px 6px rgba(255,80,60,.9); }
  }
  .gibier-btn:disabled, .debut-traque-btn:disabled, .situation-btn:disabled,
  .fin-battue-btn:disabled, .tracker-stop-btn:disabled{
    opacity:.35; filter:grayscale(.5); cursor:not-allowed;
  }
  .poste-status-pill{
    flex-shrink:0;font-size:11px;color:var(--cream-dim);display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .poste-status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--rust);animation:pulse-dot 1.6s ease-in-out infinite;}
  .poste-status-pill.error{color:var(--danger);}
  .poste-status-pill.error .dot{background:var(--danger);animation:none;}
  @keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.3;}}
  .tracker-stop-btn{
    flex-shrink:0;background:transparent;border:1px solid var(--danger);color:var(--danger);
    font-size:11px;padding:7px 12px;border-radius:4px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;
  }
  .tracker-stop-btn:hover{background:rgba(193,75,58,.12);}
  .tracker-stats{
    padding:6px 18px;font-size:11px;color:var(--cream-dim);background:var(--bg-2);
    border-bottom:1px solid var(--line);
  }
  #map{flex:1;min-height:0;background:#242a1c;}
  .leaflet-container{background:#242a1c;}
  .traqueur-panel{
    background:var(--bg-2);border-top:1px solid var(--line);flex-shrink:0;
  }
  .tp-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;cursor:pointer;user-select:none;
  }
  .tp-header .tp-chevron{color:var(--cream-dim);font-size:12px;transition:transform .2s ease;flex-shrink:0;}
  .traqueur-panel.expanded .tp-chevron{transform:rotate(180deg);}
  #tpSummary{font-size:13px;color:var(--cream);}
  .tp-body{max-height:0;overflow-y:auto;transition:max-height .25s ease;}
  .traqueur-panel.expanded .tp-body{max-height:38vh;}
  .tp-row{
    padding:10px 18px;border-bottom:1px solid var(--line);
  }
  .tp-row-top{display:flex;align-items:center;justify-content:space-between;}
  .tp-row-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
  .tp-dist{font-size:11px;color:var(--cream-dim);}
  .tp-trace-btn{
    background:transparent;border:1px solid var(--line);color:var(--cream-dim);
    font-size:11px;padding:5px 10px;border-radius:3px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;
  }
  .tp-trace-btn:hover{border-color:var(--rust);color:var(--cream);}
  .tp-row .tp-name{display:flex;align-items:center;gap:10px;font-weight:700;}
  .tp-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex-shrink:0;}
  .tp-dot.stale{background:#c99a3a;}
  .tp-dot.dead{background:var(--danger);}
  .tp-meta{font-size:12px;color:var(--cream-dim);text-align:right;}
  .marker-live.marker-poste{border-radius:6px;}

  .tp-section-label{
    padding:8px 18px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;
    color:var(--cream-dim);background:var(--bg);
  }

  .empty-state{
    flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:8px;padding:24px;text-align:center;color:var(--cream-dim);
  }
  .empty-state .es-title{color:var(--cream);font-weight:700;font-size:15px;}

  .marker-live{
    width:28px;height:28px;border-radius:50%;background:var(--rust);
    border:3px solid var(--cream);box-shadow:0 0 0 3px rgba(181,98,42,.35);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#1b1206;
    letter-spacing:-0.02em;
  }
  .marker-live.stale{background:#c99a3a;box-shadow:0 0 0 3px rgba(201,154,58,.3);}
  .marker-live.dead{background:var(--danger);box-shadow:0 0 0 3px rgba(193,75,58,.3);}

  .marker-live.marker-blink{
    animation: marker-blink-anim 0.8s steps(1,end) infinite;
  }
  @keyframes marker-blink-anim{
    0%,45%{ background:var(--rust); box-shadow:0 0 0 3px rgba(181,98,42,.45),0 0 10px 2px rgba(181,98,42,.6); }
    50%,95%{ background:#ffe066; box-shadow:0 0 0 5px rgba(255,224,102,.5),0 0 14px 4px rgba(255,224,102,.75); }
    100%{ background:var(--rust); }
  }

  .marker-assigned{
    width:26px;height:26px;border-radius:6px;background:rgba(124,143,82,.55);
    border:2px dashed var(--olive);
    display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--cream);
    letter-spacing:-0.02em;opacity:.85;
  }

  /* Icône dédiée d'Athéna : pas de fond ni de cercle, juste l'image avec un halo pulsant */
  .marker-athena{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;box-shadow:none;
  }
  .marker-athena img{
    width:100%;height:100%;display:block;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));
  }
  .marker-athena.marker-blink{
    animation: marker-athena-blink-anim 0.8s steps(1,end) infinite;
  }
  @keyframes marker-athena-blink-anim{
    0%,45%{ filter:drop-shadow(0 0 4px rgba(232,114,12,.9)) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
    50%,95%{ filter:drop-shadow(0 0 9px rgba(255,224,102,.95)) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
    100%{ filter:drop-shadow(0 0 4px rgba(232,114,12,.9)) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
  }
  .marker-athena.stale img{ filter:grayscale(35%) drop-shadow(0 0 4px rgba(201,154,58,.85)); }
  .marker-athena.dead img{ filter:grayscale(65%) drop-shadow(0 0 4px rgba(193,75,58,.85)); }

  /* Halo selon la vitesse d'Athéna : < 5 km/h vert (lent), 5-9 km/h jaune (normal), ≥ 10 km/h rouge (rapide) */
  .marker-athena.speed-slow{
    animation: marker-athena-speed-slow 2.2s steps(1,end) infinite;
  }
  @keyframes marker-athena-speed-slow{
    0%,70%{ filter:drop-shadow(0 0 4px rgba(90,200,90,.85)) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
    80%,100%{ filter:drop-shadow(0 0 10px rgba(140,235,140,1)) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
  }
  .marker-athena.speed-mid{
    animation: marker-athena-speed-mid 0.8s steps(1,end) infinite;
  }
  @keyframes marker-athena-speed-mid{
    0%,45%{ filter:drop-shadow(0 0 4px rgba(232,180,12,.9)) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
    50%,95%{ filter:drop-shadow(0 0 9px rgba(255,224,102,.95)) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
    100%{ filter:drop-shadow(0 0 4px rgba(232,180,12,.9)) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
  }
  .marker-athena.speed-fast{
    animation: marker-athena-speed-fast 0.3s steps(1,end) infinite;
  }
  @keyframes marker-athena-speed-fast{
    0%,50%{ filter:drop-shadow(0 0 5px rgba(220,50,40,.95)) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
    51%,100%{ filter:drop-shadow(0 0 13px rgba(255,90,70,1)) drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
  }

  .poste-marker{
    width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;color:#1b1206;border:2px solid rgba(255,255,255,.85);
    box-shadow:0 1px 3px rgba(0,0,0,.5);
  }

  /* Leaflet — thème sombre pour cohérence avec l'appli */
  .leaflet-control-layers{
    background:var(--panel)!important;color:var(--cream)!important;border:1px solid var(--line)!important;
    border-radius:4px!important;
  }
  .leaflet-control-layers-toggle{filter:invert(0.9);}
  .leaflet-control-layers label{font-size:13px;padding:2px 0;}
  .leaflet-popup-content-wrapper, .leaflet-tooltip{
    background:var(--panel);color:var(--cream);border:1px solid var(--line);
  }
  .leaflet-tooltip{font-size:12px;}
  .leaflet-tooltip-top:before{border-top-color:var(--line);}
  .leaflet-bar a{background:var(--panel)!important;color:var(--cream)!important;border-bottom:1px solid var(--line)!important;}
  .leaflet-bar a:hover{background:var(--bg-2)!important;}

  .leaflet-popup-tip{background:var(--panel)!important;border:1px solid var(--line)!important;}
  .leaflet-popup-close-button{color:var(--cream-dim)!important;}
  .participant-popup{
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 2px;min-width:110px;
  }
  .participant-popup img{
    width:96px;height:96px;object-fit:cover;border-radius:50%;border:2px solid var(--rust);display:block;
  }
  .participant-popup .pp-avatar{
    width:96px;height:96px;border-radius:50%;background:var(--bg-2);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--cream-dim);
  }
  .participant-popup .pp-name{font-weight:700;font-size:14px;color:var(--cream);}
  .participant-popup .pp-hint{font-size:10px;color:var(--cream-dim);text-transform:uppercase;letter-spacing:.04em;}

  .recenter-controls{display:flex;flex-direction:column;gap:6px;}
  .recenter-controls button{
    background:var(--panel);border:1px solid var(--line);color:var(--cream);
    font-size:11px;padding:7px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;
    box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .recenter-controls button:hover{border-color:var(--rust);}
  .recenter-empty{
    font-size:10px;color:var(--cream-dim);background:var(--panel);border:1px solid var(--line);
    padding:5px 9px;border-radius:4px;white-space:nowrap;
  }

  .proximity-alert{
    position:fixed;top:0;left:0;right:0;z-index:9999;pointer-events:none;
    text-align:center;font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;
    padding:14px 12px;box-shadow:0 2px 12px rgba(0,0,0,.6);
    animation:proximity-flash .7s steps(1,end) infinite;
  }
  @keyframes proximity-flash{
    0%,49%{ background:var(--danger); color:#fff; }
    50%,100%{ background:#fff; color:var(--danger); }
  }

  footer.setup-warning{
    background:#3a241a;border-top:1px solid var(--rust);padding:10px 16px;font-size:12px;color:var(--rust-light);
    text-align:center;
  }

  .gibier-bar{
    display:grid;grid-template-columns:repeat(4, 1fr);gap:6px;
    padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .gibier-btn{
    border:none;border-radius:8px;padding:8px 4px;font-weight:800;color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;transition:transform .1s;
  }
  .gibier-btn:active{transform:scale(0.94);}
  .gibier-emoji{ font-size:28px; line-height:1; }
  .gibier-label{ display:none; }
  .gibier-sanglier{background:#4a3226;}
  .gibier-chevreuil{background:#8a6a3a;}
  .gibier-renard{background:#c2632a;}
  .gibier-lievre{background:#6b6558;}

  .fin-battue-btn{
    display:none;width:100%;border:none;border-radius:8px;margin:0 12px 8px;
    padding:12px;font-size:14px;font-weight:800;letter-spacing:.03em;color:#fff;
    background:var(--ok);box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer;
  }
  .fin-battue-btn:active{transform:scale(0.98);}
  .fin-battue-btn.armed{
    background:var(--danger);
    animation:gibier-halo .5s steps(1,end) infinite;
  }

  .top-actions-bar{
    display:grid;grid-template-columns:repeat(2, 1fr);gap:6px;
    padding:0 12px 8px;
  }
  .debut-traque-btn{
    border:none;border-radius:8px;
    padding:10px 4px;font-size:11.5px;font-weight:800;letter-spacing:.02em;color:#fff;line-height:1.2;
    background:var(--olive);box-shadow:0 2px 5px rgba(0,0,0,.4);cursor:pointer;transition:transform .1s;
  }
  .debut-traque-btn:active{transform:scale(0.96);}
  .debut-traque-btn.armed{
    background:var(--danger);
    animation:gibier-halo .5s steps(1,end) infinite;
  }

  .situation-btn{
    border:none;border-radius:8px;padding:10px 4px;font-size:11.5px;font-weight:800;color:#fff;line-height:1.2;
    letter-spacing:.02em;box-shadow:0 2px 5px rgba(0,0,0,.4);cursor:pointer;transition:transform .1s;
  }
  .situation-btn:active{transform:scale(0.96);}
  .situation-sanglier-ferme{background:#4a3226;}
  .situation-incident{background:var(--danger);}
  .situation-sanglier-ferme.armed{ animation: halo-vert .5s steps(1,end) infinite; }
  .situation-incident.armed{ animation: halo-jaune .5s steps(1,end) infinite; }

  .finbattue-alert{
    position:fixed;top:72%;left:50%;z-index:9999;pointer-events:none;
    transform:translate(-50%,-50%);
    width:88%;max-width:420px;
    text-align:center;font-weight:800;font-size:26px;line-height:1.25;letter-spacing:.02em;
    padding:28px 20px;border-radius:14px;
    background:#c62828;color:#fff;
    box-shadow:0 10px 40px rgba(0,0,0,.7);
    animation:gibier-pop-center .25s ease-out, halo-rouge .6s steps(1,end) infinite;
  }
  @keyframes halo-rouge{
    0%,49%{ box-shadow:0 0 6px 2px rgba(198,40,40,.6), inset 0 0 0 2px rgba(255,255,255,.1); }
    50%,100%{ box-shadow:0 0 28px 10px rgba(255,80,80,.9), inset 0 0 0 2px rgba(255,255,255,.3); }
  }

  .debuttraque-alert{
    position:fixed;top:0;left:0;right:0;z-index:9999;pointer-events:none;
    text-align:center;font-weight:800;font-size:16px;letter-spacing:.03em;
    padding:16px 12px;background:var(--olive);color:#fff;
    box-shadow:0 2px 12px rgba(0,0,0,.6);
    animation:gibier-pop .3s ease-out;
  }

  .sanglierferme-alert{
    position:fixed;top:50%;left:50%;z-index:9999;pointer-events:none;
    transform:translate(-50%,-50%);
    width:88%;max-width:420px;
    text-align:center;font-weight:800;font-size:26px;line-height:1.25;letter-spacing:.02em;
    padding:28px 20px;border-radius:14px;
    background:#4a3226;color:#fff;
    box-shadow:0 10px 40px rgba(0,0,0,.7);

  .gibier-alert{
    position:fixed;top:50%;left:50%;z-index:9999;pointer-events:none;

    width:88%;max-width:420px;

<body>
<div class="topo"></div>
<div id="app">
  <header>
    <div class="brand">
      <span class="eyebrow">Société de Chasse · Bergères</span>
      <span class="title">Traqueur Live</span>
    </div>
  </header>
  <main id="main"></main>
</div>

<script src="native-geo-shim.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="hunt_data.js"></script>
<script>
/* ==========================================================================
   CONFIGURATION — colle ici l'URL de ton déploiement Google Apps Script
   (voir Code.gs fourni à côté). Doit ressembler à :
   https://script.google.com/macros/s/XXXXXXXXXXXXXXXXXXXXXXX/exec
   ========================================================================== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWOv9Z4JYEgeST9wBInuQFBQ8Eh_oR1_Wrn09UepBYlNjcPdoc38YQTdzqvi7RBdma/exec";

const STALE_AFTER = { traqueur: 30, poste: 150 };   // secondes avant "position ancienne" (orange)
const DEAD_AFTER  = { traqueur: 90, poste: 300 };   // secondes avant "perdu" (rouge)
const REMOVE_AFTER = 600; // secondes (10 min) — le point disparaît complètement de la carte
const SEND_INTERVAL = 7000;        // ms entre chaque envoi — traqueur
const POSTE_SEND_INTERVAL = 60000; // ms entre chaque envoi — posté (1 min)

const main = document.getElementById('main');
function setModeBadgeVisible(visible){
  const el = document.getElementById('modeBadge');
  if(el) el.style.display = visible ? 'inline-block' : 'none';
}

function configOk(){ return SCRIPT_URL && SCRIPT_URL.indexOf('http') === 0; }

/* Annonce vocale (utile mains libres en pleine battue) */
let voicesReady = false;
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = ()=>{ voicesReady = true; };
}
function speak(text, keepQueue){
  if(!('speechSynthesis' in window)) return;
  try{
    if(!keepQueue) window.speechSynthesis.cancel(); // évite d'empiler d'anciennes annonces non liées
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 1;
    const voices = window.speechSynthesis.getVoices();
    const frVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
    if(frVoice) u.voice = frVoice;
    window.speechSynthesis.speak(u);
  } catch(e){ console.warn('speech error', e); }
}

function goHome(){
  stopTracking();
  stopPosteSharing();
  stopWatching();
  setModeBadgeVisible(false);
  renderSelect();
}

function goToBriefing(){
  stopTracking();
  stopPosteSharing();
  stopWatching();
  setModeBadgeVisible(false);
  renderBriefing();
}

function updateBriefingBackVisible(){
  const el = document.getElementById('briefingBackBadge');
  if(el) el.style.display = canAccessBriefing() ? 'inline-block' : 'none';
}

function goToLastMapView(){
  const lastRole = localStorage.getItem('traqueur_last_role');
  if(lastRole === 'traqueur') renderTracker();
  else renderPoste();
}

/* Wake Lock — empêche l'écran de s'éteindre pendant le suivi (traqueur ou posté) */
let wakeLock = null;

async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch(err){
    console.warn('Wake Lock indisponible:', err);
    wakeLock = null;
  }
}

function releaseWakeLock(){
  if(wakeLock){
    wakeLock.release().catch(()=>{});
    wakeLock = null;
  }
}

// Le verrou est automatiquement relâché par le système quand l'onglet passe en arrière-plan ;
// on le redemande dès que l'appli revient au premier plan, si un suivi est toujours actif.
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && (tracking || posteWatchId !== null)){
    requestWakeLock();
  }
});

/* ---------------------------------------------------------------------- */
/* Ecran de sélection                                                     */
/* ---------------------------------------------------------------------- */
function renderSelect(){
  main.innerHTML = `
    <div class="select-screen">
      <h1>Qui es-tu aujourd'hui ?</h1>
      <div class="sub">Le traqueur partage sa position en direct. Les postés voient sa position sur la carte pendant la battue.</div>
      <button class="role-btn" onclick="renderTracker()">
        <div class="rb-eyebrow">Sur le terrain</div>
        <div class="rb-title">Je suis le traqueur</div>
        <div class="rb-desc">J'envoie ma position GPS en continu et je vois la carte avec les postés</div>
      </button>
      <button class="role-btn" onclick="renderPoste()">
        <div class="rb-eyebrow">Au poste</div>
        <div class="rb-title">Je suis posté</div>
        <div class="rb-desc">Je partage ma position automatiquement (toutes les minutes) et je vois la carte</div>
      </button>
      <button class="role-btn" onclick="renderBriefing()">
        <div class="rb-eyebrow">Avant la traque</div>
        <div class="rb-title">🎯 Briefing — répartition des postes</div>
        <div class="rb-desc">Réservé au président : cocher les postes actifs et assigner les chasseurs</div>
      </button>
      ${!configOk() ? `<div class="hint" style="color:var(--rust-light);max-width:340px">⚠ L'URL Apps Script n'est pas encore configurée dans index.html (SCRIPT_URL).</div>` : ''}
      <div class="recap-longpress-wrap">
        <button class="recap-empty" style="cursor:pointer;border:none;width:100%;color:var(--cream-dim);font:inherit;-webkit-appearance:none;appearance:none;"
          onclick="recapBtnClick()"
          onmousedown="recapBtnPressStart()" onmouseup="recapBtnPressEnd()" onmouseleave="recapBtnPressEnd()"
          ontouchstart="recapBtnPressStart()" ontouchend="recapBtnPressEnd()">📋 Voir les récaps de battues</button>
        <div class="recap-progress-track"><div class="recap-progress-fill" id="recapProgressFill"></div></div>
      </div>
    </div>
  `;
  setModeBadgeVisible(false);
}

let recapLongPressTimer = null;
let recapLongPressTriggered = false;
const RECAP_LONGPRESS_MS = 5000;

function recapBtnPressStart(){
  recapLongPressTriggered = false;
  const fill = document.getElementById('recapProgressFill');
  if(fill){
    fill.classList.remove('filling');
    fill.style.width = '0%';
    void fill.offsetWidth; // force le navigateur à repartir de zéro avant de relancer la transition
    fill.classList.add('filling');
    fill.style.transitionDuration = (RECAP_LONGPRESS_MS / 1000) + 's';
    fill.style.width = '100%';
  }
  recapLongPressTimer = setTimeout(()=>{
    recapLongPressTriggered = true;
    resetRecapProgress();
    openBattuesSpreadsheet();
  }, RECAP_LONGPRESS_MS);
}

function recapBtnPressEnd(){
  if(recapLongPressTimer){ clearTimeout(recapLongPressTimer); recapLongPressTimer = null; }
  resetRecapProgress();
}

function resetRecapProgress(){
  const fill = document.getElementById('recapProgressFill');
  if(fill){
    fill.classList.remove('filling');
    fill.style.width = '0%';
  }
}

function recapBtnClick(){
  if(recapLongPressTriggered){ recapLongPressTriggered = false; return; } // déjà géré par l'appui long
  renderBattuesList();
}

function openBattuesSpreadsheet(){
  if(!configOk()) return;
  fetch(`${SCRIPT_URL}?sheeturl=1&_t=${Date.now()}`, { cache:'no-store' })
    .then(r=>r.json())
    .then(data=>{
      if(data && data.url){ window.location.href = data.url; }
      else { window.alert("Impossible de récupérer le lien du fichier."); }
    })
    .catch(()=>window.alert("Impossible de récupérer le lien du fichier."));
}

function renderBattuesList(){
  const backTarget = tracking ? 'renderTracker()' : (posteWatchId !== null ? 'renderPoste()' : 'renderSelect()');
  const backLabel = (tracking || posteWatchId !== null) ? '↩ Retour à la carte' : '↩ Retour à l\'accueil';
  main.innerHTML = `
    <div class="recap-screen">
      <div class="recap-header">
        <div class="rb-title">📋 Récaps des battues</div>
        <div class="recap-sub">Choisis une battue pour voir le détail</div>
      </div>
      <div id="battuesList" class="recap-list"><div class="recap-empty">Chargement…</div></div>
      <button class="role-btn recap-back" onclick="${backTarget}">${backLabel}</button>
    </div>
  `;
  setModeBadgeVisible(false);

  fetch(`${SCRIPT_URL}?battues=1&_t=${Date.now()}`, { cache:'no-store' })
    .then(r=>r.json())
    .then(list=>{
      const el = document.getElementById('battuesList');
      if(!el) return;
      if(!Array.isArray(list) || !list.length){
        el.innerHTML = '<div class="recap-empty">Aucune battue enregistrée pour l\'instant.</div>';
        return;
      }
      el.innerHTML = list.map(b=>{
        const d = new Date(b.timestamp);
        const dateTxt = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        const heureTxt = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        const countTxt = b.count > 0 ? `${b.count} gibier${b.count>1?'s':''} vu${b.count>1?'s':''}` : 'Aucun gibier annoncé';
        return `
          <button class="recap-row battue-row" onclick="renderGibierRecap(${b.sinceTimestamp}, ${b.timestamp}, '${(b.debutNom||'').replace(/['"]/g,'')}', '${(b.nom||'').replace(/['"]/g,'')}')">
            <div class="recap-emoji">🏁</div>
            <div class="recap-info">
              <div class="recap-gibier">${dateTxt} · ${heureTxt}</div>
              <div class="recap-meta">${countTxt} · fin par ${b.nom}</div>
            </div>
          </button>
        `;
      }).join('');
    })
    .catch(()=>{
      const el = document.getElementById('battuesList');
      if(el) el.innerHTML = '<div class="recap-empty">Impossible de charger la liste des battues.</div>';
    });
}

/* ---------------------------------------------------------------------- */
/* Briefing du matin — répartition des postes par le président             */
/* ---------------------------------------------------------------------- */

const BRIEFING_ALLOWED = ['fabrice', 'michel', 'johnny', 'laurent'];
function canAccessBriefing(){
  const nom = localStorage.getItem('traqueur_nom') || '';
  return BRIEFING_ALLOWED.includes(normalizeName(nom));
}

function posteIdOf(p){
  return `${p.folder}||${p.name}||${p.lat.toFixed(6)}||${p.lng.toFixed(6)}`;
}

let briefingClearArmed = false;
let briefingClearArmTimeout = null;
let briefingPosteState = {};        // posteId -> {id, zone, poste, lat, lng, actif, chasseur}
let briefingOtherZonesAssigned = {}; // chasseur (normalisé) -> {poste, zone} dans une autre zone
let briefingChasseursHabituels = [];
let briefingPresenceState = {};     // nom-habituel ou 'invite-N' -> {nom, present}
let briefingGuestDebounce = {};

function briefingDeniedScreen(){
  main.innerHTML = `
    <div class="select-screen">
      <h1>🎯 Briefing</h1>
      <div class="briefing-denied">Cet écran est réservé à Fabrice, Michel et Johnny.<br>Indique ton prénom sur l'écran traqueur ou posté si c'est toi.</div>
      <button class="role-btn recap-back" onclick="renderSelect()">↩ Retour à l'accueil</button>
    </div>
  `;
  setModeBadgeVisible(false);
}

// Écran 1 : choix de la zone (la Ferme n'est pas concernée par le briefing)
function renderBriefing(){
  if(!canAccessBriefing()){ briefingDeniedScreen(); return; }

  const postes = (typeof HUNT_DATA !== 'undefined' && HUNT_DATA.postes) ? HUNT_DATA.postes : [];
  const zoneOrder = [];
  const zoneColor = {};
  postes.forEach(p=>{
    const folder = p.folder || 'Postes';
    if(folder === 'La Ferme') return;
    if(!(folder in zoneColor)){ zoneColor[folder] = p.color || '#b5622a'; zoneOrder.push(folder); }
  });

  main.innerHTML = `
    <div class="select-screen">
      <h1>🎯 Briefing</h1>
      <div class="sub">Choisis la zone à répartir avant la traque.</div>
      ${zoneOrder.map(z=>`
        <button class="role-btn briefing-zone-btn" style="border-color:${zoneColor[z]}77;" onclick="renderBriefingZone('${z.replace(/'/g,"\\'")}')">
          <div class="rb-eyebrow" style="color:${zoneColor[z]};">Zone</div>
          <div class="rb-title">${z}</div>
        </button>
      `).join('')}
      <button class="role-btn recap-back" onclick="goToLastMapView()">🗺 Voir la carte</button>
      <button class="role-btn recap-back" onclick="renderBriefingHistoryList()">📜 Historique des briefings</button>
      <button class="role-btn recap-back" onclick="renderSelect()">↩ Retour à l'accueil</button>
    </div>
  `;
  setModeBadgeVisible(false);
}

// Écran 2 : répartition d'une zone (postes → présence → attribution)
function renderBriefingZone(zoneName){
  if(!canAccessBriefing()){ briefingDeniedScreen(); return; }

  const postes = ((typeof HUNT_DATA !== 'undefined' && HUNT_DATA.postes) ? HUNT_DATA.postes : [])
    .filter(p => (p.folder || 'Postes') === zoneName);

  main.innerHTML = `
    <div class="recap-screen">
      <div class="recap-header">
        <div class="rb-title">🎯 ${zoneName}</div>
        <div class="recap-sub">1. Coche les chasseurs présents · 2. Coche les postes utilisés · 3. Attribue un chasseur à chaque poste retenu</div>
      </div>

      <div class="briefing-section-title">1 · Chasseurs présents aujourd'hui</div>
      <div id="briefingPresenceList" class="recap-empty">Chargement…</div>

      <div class="briefing-section-title">2 · Postes utilisés dans cette zone</div>

function initBriefingPosteState(postes, briefing){
  briefingPosteState = {};
  briefingOtherZonesAssigned = {}; // chasseur (normalisé) -> {poste, zone} dans une AUTRE zone que celle-ci
  const currentZone = postes.length ? postes[0].folder : null;
  Object.keys(briefing).forEach(id=>{
    const entry = briefing[id];
    if(entry.zone !== currentZone && entry.actif && entry.chasseur){
      briefingOtherZonesAssigned[normalizeName(entry.chasseur)] = { poste: entry.poste, zone: entry.zone };
    }
  });
  postes.forEach(p=>{
    const id = posteIdOf(p);
    const saved = briefing[id];
    briefingPosteState[id] = {
      id, zone: p.folder, poste: p.name, lat: p.lat, lng: p.lng,
      actif: saved ? saved.actif : false,   // par défaut : aucun poste retenu, on coche ceux utilisés
      chasseur: saved ? (saved.chasseur || '') : ''
    };
  });
}

function initBriefingPresenceState(chasseurs, presence){
  briefingChasseursHabituels = chasseurs;
  briefingPresenceState = {};
  chasseurs.forEach(nom=>{
    const rec = presence[nom];
    briefingPresenceState[nom] = { nom, present: rec ? rec.present : false, isGuest:false }; // par défaut : absent, on coche les présents
  });
  for(let i=1;i<=4;i++){
    const slot = 'invite-' + i;
    const rec = presence[slot];
    briefingPresenceState[slot] = { nom: rec ? (rec.nom || '') : '', present: rec ? rec.present : false, isGuest:true };
  }
}

function getPresentChasseursList(){
  const present = [];
  briefingChasseursHabituels.forEach(nom=>{
    if(briefingPresenceState[nom] && briefingPresenceState[nom].present) present.push(nom);
  });
  for(let i=1;i<=4;i++){
    const slot = 'invite-' + i;
    const st = briefingPresenceState[slot];
    if(st && st.present && st.nom && st.nom.trim()) present.push(st.nom.trim());
  }
  return present;
}

function getAssignedElsewhere(excludePosteId){
  const taken = new Set(Object.keys(briefingOtherZonesAssigned)); // déjà normalisés (autres zones)
  Object.values(briefingPosteState).forEach(row=>{
    if(row.id === excludePosteId) return;
    if(row.actif && row.chasseur) taken.add(normalizeName(row.chasseur));
  });
  return taken;
}

function renderBriefingAssignSection(){
  const el = document.getElementById('briefingAssignList');
  const countEl = document.getElementById('briefingAssignCount');
  if(!el) return;
  const present = getPresentChasseursList();
  const retained = Object.values(briefingPosteState).filter(r=>r.actif);

  if(!retained.length){
    el.innerHTML = '<div class="recap-empty">Aucun poste retenu dans cette zone.</div>';
    if(countEl) countEl.textContent = '';
    return;
  }

  el.innerHTML = retained.map(r=>{
    const takenElsewhere = getAssignedElsewhere(r.id);
    const availablePresent = present.filter(c => !takenElsewhere.has(normalizeName(c)));

    const options = ['<option value="">—</option>']
      .concat(availablePresent.map(c=>`<option value="${c}" ${c===r.chasseur?'selected':''}>${c}</option>`));
    if(r.chasseur && !availablePresent.includes(r.chasseur)){
      let extraLabel = ' (absent ?)';
      if(present.includes(r.chasseur) && takenElsewhere.has(normalizeName(r.chasseur))) extraLabel = ' (déjà ailleurs ?)';
      options.push(`<option value="${r.chasseur}" selected>${r.chasseur}${extraLabel}</option>`);
    }
    return `
      <div class="briefing-row">
        <div class="briefing-poste-name">${r.poste}</div>
        <select class="briefing-select" onchange="onAssignChange('${r.id}', this.value)">
          ${options.join('')}
        </select>
      </div>
    `;
  }).join('');

  const assignedCount = retained.filter(r=>r.chasseur).length;
  if(countEl) countEl.textContent = `(${assignedCount}/${retained.length})`;
}

function onAssignChange(posteId, chasseur){
  const st = briefingPosteState[posteId];
  if(!st) return;
  st.chasseur = chasseur;
  persistPosteState(st);
  renderBriefingAssignSection();
}

let watchId = null;
let sendTimer = null;
let lastFix = null;
let trackDistance = 0;
let lastTrackedPos = null;
let trackerId = localStorage.getItem('traqueur_id') || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
const APP_BOOT_TIME = Date.now(); // sert à ignorer les alertes déjà en place avant l'ouverture de l'appli, sans jamais avaler la toute première alerte réelle sur un déploiement neuf
localStorage.setItem('traqueur_id', trackerId);

function haversine(a, b){
  const R = 6371000, toRad = x => x * Math.PI / 180;
  const dLat = toRad(b[0]-a[0]), dLng = toRad(b[1]-a[1]);
  const lat1 = toRad(a[0]), lat2 = toRad(b[0]);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// Vitesse d'Athéna calculée entre deux positions successives (pas de matériel dédié requis,
// juste la distance parcourue divisée par le temps écoulé entre deux envois de position).
// La carte vérifie les positions toutes les 5s alors qu'Athéna n'envoie que toutes les 7s :
// on garde la dernière vitesse connue tant qu'aucun nouveau relevé n'est arrivé, pour éviter
// que le halo ne clignote entre "vitesse connue" et "inconnue" à chaque sondage.
let athenaPrevFix = null; // { lat, lng, timestamp }
let athenaLastSpeedKmh = null;
function athenaSpeedKmh(lat, lng, timestamp){
  if(!athenaPrevFix){ athenaPrevFix = { lat, lng, timestamp }; return athenaLastSpeedKmh; }
  if(timestamp === athenaPrevFix.timestamp) return athenaLastSpeedKmh; // pas de nouveau relevé
  const dtSec = (timestamp - athenaPrevFix.timestamp) / 1000;
  // écarts trop courts (bruit GPS) ou trop longs (coupure de signal) : on garde la dernière valeur connue
  if(dtSec < 1.5 || dtSec > 120){
    athenaPrevFix = { lat, lng, timestamp };
    return athenaLastSpeedKmh;
  }
  const distM = haversine([athenaPrevFix.lat, athenaPrevFix.lng], [lat, lng]);
  athenaLastSpeedKmh = (distM / dtSec) * 3.6;
  athenaPrevFix = { lat, lng, timestamp };
  return athenaLastSpeedKmh;
}

let currentPostes = (typeof HUNT_DATA !== 'undefined' && HUNT_DATA.postes) ? HUNT_DATA.postes : [];

function nearestPosteName(lat, lng){
  if(!currentPostes || !currentPostes.length) return '';
  let best = null, bestDist = Infinity;
  currentPostes.forEach(p=>{
    const d = haversine([lat, lng], [p.lat, p.lng]);
    if(d < bestDist){ bestDist = d; best = p; }
  });
  if(!best || bestDist > 250) return ''; // trop loin de tout poste connu, on ne devine pas
  return best.name || '';
}
function fmtDist(d){
  return d >= 1000 ? (d/1000).toFixed(2) + ' km' : Math.round(d) + ' m';
}

let tracking = false;

function startTrackingUI(){
  if(!configOk() || !navigator.geolocation) return;

  tracking = true;
  trackDistance = 0;
  lastTrackedPos = null;
  setTrackerStatus(true);
  let firstFixSent = false;

  watchId = navigator.geolocation.watchPosition(pos=>{
    lastFix = pos;
    if(lastTrackedPos){
      const d = haversine(
        [lastTrackedPos.coords.latitude, lastTrackedPos.coords.longitude],
        [pos.coords.latitude, pos.coords.longitude]
      );
      if(d > 3) trackDistance += d; // ignore le bruit GPS statique (<3m)
    }
    lastTrackedPos = pos;
    updateTrackerStats(pos.coords.accuracy);
    if(!firstFixSent){
      firstFixSent = true;
      sendPosition(); // envoie dès qu'on a une position, sans attendre les 7s suivantes
    }
  }, err=>{
    console.warn('GPS error', err);
    setTrackerStatus(false);
  }, { enableHighAccuracy:true, maximumAge:5000, timeout:15000 });

  sendTimer = setInterval(sendPosition, SEND_INTERVAL);
  requestWakeLock();
}

function setTrackerStatus(ok){
  const pill = document.getElementById('trackerStatusPill');
  if(!pill) return;
  if(ok){
    pill.classList.remove('error');
    pill.innerHTML = '<span class="dot"></span>En direct';
  } else {
    pill.classList.add('error');
    pill.innerHTML = '<span class="dot"></span>Position indisponible';
  }
}

function updateTrackerStats(accuracy){
  const el = document.getElementById('trackerStats');
  if(!el) return;
  el.textContent = `Précision ${Math.round(accuracy)} m · Distance parcourue ${fmtDist(trackDistance)}`;
}

function stopTrackingUI(){
  tracking = false;
  stopTracking();
  // signale l'arrêt au serveur pour que les postés voient "hors ligne"
  fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'stop', id: trackerId }) }).catch(()=>{});
  goHome();
}

function stopTracking(){
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  if(sendTimer){ clearInterval(sendTimer); sendTimer = null; }
  releaseWakeLock();
}

function sendPosition(){
  if(!lastFix) return;
  const nomInput = document.getElementById('nomInput');
  const nom = ((nomInput && nomInput.value) || 'Traqueur').trim();
  const body = {
    id: trackerId,
    nom: nom,
    role: 'traqueur',
    lat: lastFix.coords.latitude,
    lng: lastFix.coords.longitude,
    accuracy: lastFix.coords.accuracy
  };
  fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify(body) })
    .catch(err=>console.warn('send error', err));
}

let traces = {}; // id -> { latlngs, line, color, lastTs }
const traceColorPalette = ['#b5622a','#3f6fa8','#4f8f4a','#d6b83a','#a8714a','#8a4a9a'];
let traceColorIndex = 0;

function getOrCreateTrace(id){
  if(!traces[id]){
    const color = traceColorPalette[traceColorIndex % traceColorPalette.length];
    traceColorIndex++;
    traces[id] = {
      latlngs: [],
      line: L.polyline([], { color, weight:3, opacity:0.85, dashArray:'1 7' }),
      color,
      lastTs: 0
    };
    if(map) traces[id].line.addTo(map);
  }
  return traces[id];
}

function updateTrace(id, latlng, ts){
  const tr = getOrCreateTrace(id);
  if(ts && tr.lastTs === ts) return;
  tr.lastTs = ts;
  tr.latlngs.push(latlng);
  tr.line.setLatLngs(tr.latlngs);
}

function traceDistance(id){
  const tr = traces[id];
  if(!tr || tr.latlngs.length < 2) return '';
  let d = 0;
  for(let i=1;i<tr.latlngs.length;i++) d += haversine(tr.latlngs[i-1], tr.latlngs[i]);
  return fmtDist(d);
}

function loadFullTrace(id){
  fetch(`${SCRIPT_URL}?history=1&id=${encodeURIComponent(id)}`)
    .then(r=>r.json())
    .then(points=>{
      if(!points.length) return;
      const latlngs = points.map(p=>[p.lat, p.lng]);
      const tr = getOrCreateTrace(id);
      tr.latlngs = latlngs;
      tr.line.setLatLngs(latlngs);
      tr.lastTs = points[points.length-1].timestamp;
      resetMapIdleTimer(); // on vient de recadrer volontairement sur la trace, on retarde le recentrage auto
      map.fitBounds(latlngs, { maxZoom:17, padding:[40,40] });
    })
    .catch(err=>console.warn('history error', err));
}

/* -------- partage de position automatique en mode posté (toutes les 60s) -------- */
let posteWatchId = null;
let posteSendTimer = null;
let posteLastFix = null;

function startPosteSharing(){
  if(!configOk() || !navigator.geolocation) return;
  let firstFixSent = false;

  posteWatchId = navigator.geolocation.watchPosition(pos=>{
    posteLastFix = pos;
    setPosteStatus(true);
    if(!firstFixSent){
      firstFixSent = true;
      sendPostePosition(); // envoie dès qu'on a une position, sans attendre la minute suivante
    }
  }, err=>{
    console.warn('GPS error', err);
    setPosteStatus(false);
  }, { enableHighAccuracy:true, maximumAge:15000, timeout:20000 });

  posteSendTimer = setInterval(sendPostePosition, POSTE_SEND_INTERVAL);
  requestWakeLock();
}

function setPosteStatus(ok){
  const pill = document.getElementById('posteStatusPill');
  if(!pill) return;
  if(ok){
    pill.classList.remove('error');
    pill.innerHTML = '<span class="dot"></span>Position partagée';
  } else {
    pill.classList.add('error');
    pill.innerHTML = '<span class="dot"></span>Position indisponible';
  }
}

function sendPostePosition(){
  if(!posteLastFix) return;
  const nomInput = document.getElementById('posteNomInput');
  const nom = ((nomInput && nomInput.value) || 'Posté').trim();
  const body = {
    id: trackerId,
    nom: nom,
    role: 'poste',
    lat: posteLastFix.coords.latitude,
    lng: posteLastFix.coords.longitude,
    accuracy: posteLastFix.coords.accuracy
  };
  fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify(body) }).catch(err=>console.warn('send error', err));
}

function stopPosteSharing(){
  if(posteWatchId !== null){ navigator.geolocation.clearWatch(posteWatchId); posteWatchId = null; }
  if(posteSendTimer){ clearInterval(posteSendTimer); posteSendTimer = null; }
  if(posteLastFix){
    fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'stop', id: trackerId }) }).catch(()=>{});
  }
  posteLastFix = null;
  releaseWakeLock();
}

let mapIdleTargetRole = null; // 'traqueur' ou 'poste' — vers qui on recentre après 10s d'inactivité

function initMap(idleTargetRole){
  mapIdleTargetRole = idleTargetRole || null;
  const fallbackCenter = huntDataCenter() || [48.28, 4.07];
  map = L.map('map', { zoomControl:true, attributionControl:true }).setView(fallbackCenter, 14);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Esri, Maxar, Earthstar Geographics'
  }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    opacity: 0.9
  }).addTo(map);
  map.on('dragstart zoomstart', resetMapIdleTimer);
  map.on('popupopen', (e)=>{ setTimeout(()=>{ map.closePopup(e.popup); }, 3000); });
  addHuntLayers(); // affichage immédiat avec les données embarquées (hunt_data.js)
  addRecenterControls();
  resetMapIdleTimer();
  refreshHuntDataFromServer(); // puis on va chercher la version à jour de My Maps
  huntRefreshTimer = setInterval(refreshHuntDataFromServer, 60 * 60 * 1000); // toutes les heures
}

function addRecenterControls(){
  const ctrl = L.control({ position: 'bottomleft' });
  ctrl.onAdd = function(){
    const div = L.DomUtil.create('div', 'recenter-controls');
    div.innerHTML = `
      <button onclick="centerOnRole('traqueur')">🎯 Sur la traque</button>
      <button onclick="centerOnRole('poste')">📍 Sur les postés</button>
    `;
    L.DomEvent.disableClickPropagation(div);
    return div;
  };
  ctrl.addTo(map);
}

function resetMapIdleTimer(){
  if(mapIdleTimer){ clearTimeout(mapIdleTimer); mapIdleTimer = null; }
  if(!mapIdleTargetRole) return;
  mapIdleTimer = setTimeout(()=>{ centerOnRole(mapIdleTargetRole); }, 10000);
}

// Coordonnées des postes assignés au briefing dont le chasseur n'est pas encore enregistré en
// direct (mêmes critères que renderAssignedMarkers) : on veut aussi centrer la carte dessus.
function assignedPosteCoords(){
  const postes = (typeof HUNT_DATA !== 'undefined' && HUNT_DATA.postes) ? HUNT_DATA.postes : [];
  if(!postes.length) return [];
  const posteById = {};
  postes.forEach(p=>{ posteById[posteIdOf(p)] = p; });

  const liveNames = new Set(
    Object.values(lastPositions)
      .filter(t=>(t.role||'traqueur') === 'poste')
      .map(t=>normalizeName(t.nom))
  );

  const coords = [];
  Object.keys(briefingCache).forEach(posteId=>{
    const state = briefingCache[posteId];
    if(!state || !state.actif || !state.chasseur) return;
    if(liveNames.has(normalizeName(state.chasseur))) return; // déjà compté en direct
    const p = posteById[posteId];
    if(!p) return;
    coords.push([p.lat, p.lng]);
  });
  return coords;
}

function averageCenter(role){
  const ids = Object.keys(lastPositions).filter(id => (lastPositions[id].role || 'traqueur') === role);
  let points = ids.map(id => [lastPositions[id].lat, lastPositions[id].lng]);

  if(role === 'poste'){
    points = points.concat(assignedPosteCoords()); // + postes attribués pas encore enregistrés
  }

  if(!points.length) return null;
  let sumLat = 0, sumLng = 0;
  points.forEach(([lat,lng])=>{ sumLat += lat; sumLng += lng; });
  return [sumLat / points.length, sumLng / points.length];
}

function centerOnRole(role){
  if(!map) return;
  const c = averageCenter(role);
  if(c){
    map.panTo(c, { animate:true });
  } else {
    flashNoData(role);
  }
  resetMapIdleTimer(); // relance le cycle : re-recentrera dans 10s si la carte n'est pas retouchée
}

function flashNoData(role){
  const container = document.querySelector('.recenter-controls');
  if(!container) return;
  const label = role === 'poste' ? 'posté actif' : 'traqueur actif';
  const msg = document.createElement('div');
  msg.className = 'recenter-empty';
  msg.textContent = `Aucun ${label} pour le moment`;
  container.appendChild(msg);
  setTimeout(()=>{ msg.remove(); }, 2500);
}

function refreshHuntDataFromServer(){
  if(!configOk()) return;
  fetch(`${SCRIPT_URL}?huntdata=1&_t=${Date.now()}`, { cache:'no-store' })
    .then(r=>r.json())
    .then(data=>{
      if(!data || data.error){ console.warn('huntdata error', data && data.error); return; }
      if(Array.isArray(data.postes)) addHuntLayers(data);
    })
    .catch(err=>console.warn('huntdata fetch error', err));
}

function huntDataCenter(){
  if(typeof HUNT_DATA === 'undefined' || !HUNT_DATA.postes || !HUNT_DATA.postes.length) return null;
  const lats = HUNT_DATA.postes.map(p=>p.lat), lngs = HUNT_DATA.postes.map(p=>p.lng);
  return [ (Math.min(...lats)+Math.max(...lats))/2, (Math.min(...lngs)+Math.max(...lngs))/2 ];
}

// Normalise un nom (accents, apostrophes typographiques, espaces, casse) pour un matching
// robuste même si la source (KMZ statique vs. My Maps en direct) encode le texte différemment.
function normalizeName(str){
  return (str || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[\u2018\u2019\u02BC]/g, "'")
    .trim()
    .toLowerCase()
    .replace(/\s+/g, ' ');
}

const ATHENA_NAME_NORM = normalizeName('Athéna');

function specialPosteIcon(name, fallbackColor){
  const def = SPECIAL_POSTE_ICONS_NORM[normalizeName(name)];
  if(!def) return null;
  const bg = def.bg || fallbackColor;
  const s = def.size;
  return L.divIcon({
    className:'',
    html:`<div style="width:${s}px;height:${s}px;border-radius:50%;background:${bg};border:2px solid ${def.border};box-shadow:0 1px 3px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;">
            <svg viewBox="0 0 40 40" width="${s-4}" height="${s-4}">${def.svg}</svg>
          </div>`,
    iconSize:[s, s], iconAnchor:[s/2, s/2]
  });
}

function miradorIcon(folder, number, color){
  const src = MIRADOR_ICONS[folder];
  if(!src) return null;
  const w = 22, h = Math.round(w * 140 / 91); // proportions de l'image d'origine
  const badge = number ? `
    <span style="position:absolute;bottom:-3px;right:-6px;background:${color};color:#fff;
      font-size:9px;font-weight:800;line-height:1;min-width:14px;text-align:center;
      padding:2px 3px;border-radius:8px;border:1.5px solid rgba(255,255,255,.85);
      box-shadow:0 1px 2px rgba(0,0,0,.6);">${number}</span>` : '';
  return L.divIcon({
    className:'',
    html:`<div style="position:relative;width:${w}px;height:${h}px;">
            <img src="${src}" style="width:${w}px;height:${h}px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));display:block;">
            ${badge}
          </div>`,
    iconSize:[w, h], iconAnchor:[w/2, h] // ancré en bas : le pied de la structure = position GPS
  });
}

function addHuntLayers(data){
  data = data || (typeof HUNT_DATA !== 'undefined' ? HUNT_DATA : null);
  if(!data) return;
  currentPostes = data.postes || currentPostes;

  // si on reconstruit après un rafraîchissement live, on retire proprement les calques précédents
  if(huntState){
    if(huntState.control) map.removeControl(huntState.control);
    Object.values(huntState.overlays).forEach(g=>{ if(g && map.hasLayer(g)) map.removeLayer(g); });
    huntState = null;
  }

  const groups = {}; // folder name -> L.layerGroup
  data.postes.forEach(p=>{
    if(!groups[p.folder]) groups[p.folder] = L.layerGroup();
    const isMirador = /mirador/i.test(p.name);
    const miradorNum = isMirador ? ((p.name.match(/\d+/) || [''])[0]) : '';
    const special = isMirador ? miradorIcon(p.folder, miradorNum, p.color) : specialPosteIcon(p.name, p.color);
    const label = isMirador ? 'M' : (p.name || '').slice(0,2);
    const icon = special || postDivIcon(p.color, label);
    L.marker([p.lat, p.lng], { icon })
      .bindTooltip(p.name || p.folder, { direction:'top', offset:[0,-12] })
      .addTo(groups[p.folder]);
  });

  const gibiersGroup = L.layerGroup();
  data.gibiers.forEach(g=>{
    L.circleMarker([g.lat, g.lng], {
      radius:6, color:'#8a6a3a', weight:2, fillColor:'#c99a3a', fillOpacity:0.9
    }).bindTooltip(g.name || 'Gibier observé', { direction:'top' }).addTo(gibiersGroup);
  });

  const zonesGroup = L.layerGroup();
  data.zones.forEach(z=>{
    L.polygon(z.coords, {
      color: z.color, weight:2, fillColor: z.color, fillOpacity: Math.max(z.fillOpacity, 0.12)
    }).bindTooltip(z.name, { direction:'center', permanent:false }).addTo(zonesGroup);
  });

  const overlays = {
    '🔴 Postes Rouges': groups['Postes Rouges'],
    '🟡 Postes Jaunes': groups['Postes Jaunes'],
    '🟢 Postes Verts': groups['Postes Verts'],
    '🔵 Postes Bleus': groups['Postes Bleus'],
    '🟤 La Ferme': groups['La Ferme'],
    '🐗 Gibiers observés': gibiersGroup,
    '▭ Zones': zonesGroup,
  };

  Object.keys(overlays).forEach(key=>{
    if(!overlays[key]) return;
    if(key === '🐗 Gibiers observés') return; // masqué par défaut, trop dense
    overlays[key].addTo(map);
  });

  const control = L.control.layers(null, overlays, { collapsed:true, position:'topright' }).addTo(map);
  huntState = { overlays, control };
}

function stopWatching(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  if(huntRefreshTimer){ clearInterval(huntRefreshTimer); huntRefreshTimer = null; }
  markers = {};
  Object.values(traces).forEach(tr=>{ if(map) map.removeLayer(tr.line); });
  traces = {};
  traceColorIndex = 0;
  huntState = null;
  setProximityAlert(false);
  Object.values(assignedMarkers).forEach(m=>{ if(map) map.removeLayer(m); });
  assignedMarkers = {};
  briefingCache = {};
}

function pollPositions(){
  const bust = '_t=' + Date.now(); // anti-cache : certains navigateurs mobiles mettent en cache les GET identiques

  fetch(`${SCRIPT_URL}?${bust}`, { cache:'no-store' }).then(r=>r.json()).then(data=>{
    const filtered = {};
    Object.keys(data).forEach(id=>{
      if(ageSeconds(data[id].timestamp) <= REMOVE_AFTER) filtered[id] = data[id];
    });
    lastPositions = filtered;
    renderTraqueurPanel(filtered);
    renderMarkers(filtered);
    renderAssignedMarkers(filtered);
    checkProximityAlert();
  }).catch(err=>console.warn('poll error', err));

  // le briefing change rarement (assignation par le président avant la traque) : on ne le
  // rafraîchit qu'1 fois sur 4 (~20s) pour ne pas surcharger le backend inutilement
  pollCount++;
  if(pollCount % 4 === 1){
    fetch(`${SCRIPT_URL}?briefing=1&${bust}`, { cache:'no-store' }).then(r=>r.json()).then(b=>{
      briefingCache = b || {};
    }).catch(err=>console.warn('briefing poll error', err));
  }

  fetch(`${SCRIPT_URL}?gibieralert=1&${bust}`, { cache:'no-store' }).then(r=>r.json()).then(alert=>{
    checkGibierAlert(alert);
  }).catch(err=>console.warn('gibier poll error', err));

  fetch(`${SCRIPT_URL}?finbattue=1&${bust}`, { cache:'no-store' }).then(r=>r.json()).then(alert=>{
    checkFinBattueAlert(alert);
  }).catch(err=>console.warn('fin battue poll error', err));

  fetch(`${SCRIPT_URL}?debuttraque=1&${bust}`, { cache:'no-store' }).then(r=>r.json()).then(alert=>{
    checkDebutTraqueAlert(alert);
  }).catch(err=>console.warn('debut traque poll error', err));

  fetch(`${SCRIPT_URL}?sanglierferme=1&${bust}`, { cache:'no-store' }).then(r=>r.json()).then(alert=>{
    checkSanglierFermeAlert(alert);
  }).catch(err=>console.warn('sanglier ferme poll error', err));

  fetch(`${SCRIPT_URL}?incident=1&${bust}`, { cache:'no-store' }).then(r=>r.json()).then(alert=>{
    checkIncidentAlert(alert);
  }).catch(err=>console.warn('incident poll error', err));
}

const GIBIER_EMOJI = { 'Sanglier':'🐗', 'Chevreuil':'🦌', 'Renard':'🦊', 'Lièvre':'🐇', 'Sanglier au ferme':'🐗', 'Incident dans la traque':'⚠️' };
let lastGibierSend = 0;
let lastGibierType = null;

// Majuscule sur la 1ère lettre, halo rouge + désactivation des boutons d'action tant que le champ est vide
function updateNomState(inputEl){
  if(!inputEl) return '';
  const raw = inputEl.value;
  if(raw.length && raw[0] !== raw[0].toUpperCase()){
    const pos = inputEl.selectionStart;
    inputEl.value = raw[0].toUpperCase() + raw.slice(1);
    try{ inputEl.setSelectionRange(pos, pos); }catch(e){}
  }
  const isEmpty = inputEl.value.trim().length === 0;
  inputEl.classList.toggle('name-input-empty', isEmpty);
  localStorage.setItem('traqueur_nom', inputEl.value);

  const screen = inputEl.closest('.poste-screen');
  if(screen){
    screen.querySelectorAll('.gibier-btn, .debut-traque-btn, .situation-btn, .fin-battue-btn, .tracker-stop-btn').forEach(btn=>{
      btn.disabled = isEmpty;
    });
  }
  return inputEl.value;
}

function formatRecapTime(ts){
  const d = new Date(ts);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  const ss = String(d.getSeconds()).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const mo = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return `${hh}:${mm}':${ss}" - ${dd}/${mo}/${yyyy}`;
}

function renderGibierRecap(sinceTs, untilTs, debutNom, finNom){
  // on nettoie seulement l'affichage carte/polling — le GPS (traqueur ou posté) continue de tourner en arrière-plan
  stopWatching();
  setModeBadgeVisible(false);

  const backTarget = tracking ? 'renderTracker()' : (posteWatchId !== null ? 'renderPoste()' : 'renderSelect()');
  const backLabel = (tracking || posteWatchId !== null) ? '↩ Retour à la carte' : '↩ Retour à l\'accueil';

  main.innerHTML = `
    <div class="recap-screen">
      <div class="recap-header">
        <div class="rb-title">🏁 Récap de la battue</div>
        <div class="recap-sub">Déroulé de la traque</div>
      </div>
      <div id="recapList" class="recap-list"><div class="recap-empty">Chargement…</div></div>
      <button class="role-btn recap-back" onclick="${backTarget}">${backLabel}</button>
    </div>
  `;

  fetch(`${SCRIPT_URL}?gibierrecap=1&since=${sinceTs}&until=${untilTs}&_t=${Date.now()}`, { cache:'no-store' })
    .then(r=>r.json())
    .then(list=>{
      const el = document.getElementById('recapList');
      if(!el) return;

      const items = Array.isArray(list) ? list.map(g=>({
        kind:'gibier', emoji: GIBIER_EMOJI[g.gibier] || '🐾', label: g.gibier,
        meta: `${g.nom} · ${g.poste ? g.poste : (g.role === 'poste' ? 'Poste inconnu' : 'En traque')}`,
        timestamp: g.timestamp
      })) : [];

      items.push({ kind:'fin', emoji:'🏁', label:'FIN DE BATTUE', meta: finNom || '', timestamp: untilTs });
      if(sinceTs > 0){
        items.push({ kind:'debut', emoji:'🏹', label:'DÉBUT DE TRAQUE', meta: debutNom || '', timestamp: sinceTs });
      }

      items.sort((a,b)=> a.timestamp - b.timestamp); // ordre chronologique croissant (début → gibiers → fin)

      el.innerHTML = items.map(item=>{
        const rowClass = item.kind === 'gibier' ? 'recap-row' : `recap-row recap-row-${item.kind}`;
        return `
          <div class="${rowClass}">
            <div class="recap-emoji">${item.emoji}</div>
            <div class="recap-info">
              <div class="recap-gibier">${item.label}</div>
              ${item.meta ? `<div class="recap-meta">${item.meta}</div>` : ''}
              <div class="recap-time">${formatRecapTime(item.timestamp)}</div>
            </div>
          </div>
        `;
      }).join('');
    })
    .catch(err=>{
      console.warn('recap fetch error', err);
      const el = document.getElementById('recapList');
      if(el) el.innerHTML = '<div class="recap-empty">Impossible de charger le récap.</div>';
    });
}

/* Alarme stridente synthétisée (aucun fichier son nécessaire) — va-et-vient rapide, timbre carré perçant */
function playStridentAlarm(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    gain.gain.value = 0.22;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const now = ctx.currentTime;
    const cycleLen = 0.35, cycles = 6;
    let t = now;
    for(let i=0; i<cycles; i++){
      osc.frequency.setValueAtTime(1000, t);
      osc.frequency.linearRampToValueAtTime(1600, t + cycleLen/2);
      osc.frequency.linearRampToValueAtTime(1000, t + cycleLen);
      t += cycleLen;
    }
    osc.start(now);
    osc.stop(t);
    osc.onended = ()=>ctx.close();
  } catch(e){ console.warn('strident alarm error', e); }
}

/* Trompe de chasse synthétisée — un seul coup long (aucun fichier son nécessaire) */
function playLongHorn(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const duration = 2.6;
    const osc = ctx.createOscillator();
    const osc2 = ctx.createOscillator(); // harmonique à l'octave, pour un timbre plus riche/cuivré
    const gain = ctx.createGain();
    const gain2 = ctx.createGain();
    osc.type = 'sawtooth';
    osc2.type = 'triangle';
    osc.frequency.value = 233;
    osc2.frequency.value = 233 * 2;
    gain2.gain.value = 0.18;
    osc.connect(gain);
    osc2.connect(gain2);
    gain2.connect(gain);
    gain.connect(ctx.destination);
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.45, now + 0.15);
    gain.gain.setValueAtTime(0.45, now + duration - 0.3);
    gain.gain.linearRampToValueAtTime(0, now + duration);
    osc.start(now); osc.stop(now + duration);
    osc2.start(now); osc2.stop(now + duration);
    setTimeout(()=>ctx.close(), (duration + 0.4) * 1000);
  } catch(e){ console.warn('long horn error', e); }
}

/* Trompe de chasse synthétisée — 4 coups longs et puissants (aucun fichier son nécessaire) */
function playHornBlasts(times){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const blastDuration = 1.15;
    const gap = 0.3;
    for(let i=0; i<times; i++){
      const start = ctx.currentTime + i * (blastDuration + gap);
      const osc = ctx.createOscillator();
      const osc2 = ctx.createOscillator(); // harmonique à l'octave, pour un timbre plus riche/cuivré
      const gain = ctx.createGain();
      const gain2 = ctx.createGain();
      osc.type = 'sawtooth';
      osc2.type = 'triangle';
      osc.frequency.value = 233;      // grave et puissant, façon trompe de chasse
      osc2.frequency.value = 233 * 2;
      gain2.gain.value = 0.18;
      osc.connect(gain);
      osc2.connect(gain2);
      gain2.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.45, start + 0.1);
      gain.gain.setValueAtTime(0.45, start + blastDuration - 0.18);
      gain.gain.linearRampToValueAtTime(0, start + blastDuration);
      osc.start(start); osc.stop(start + blastDuration);
      osc2.start(start); osc2.stop(start + blastDuration);
    }
    setTimeout(()=>ctx.close(), (times * (blastDuration + gap) + 0.5) * 1000);
  } catch(e){ console.warn('horn error', e); }
}

/* Alerte de proximité — prévient un posté quand un traqueur s'approche à moins de 100m */
function checkProximityAlert(){
  if(!posteLastFix){ setProximityAlert(false); return; } // on n'est pas posté (ou pas encore de fix GPS)
  const myPos = [posteLastFix.coords.latitude, posteLastFix.coords.longitude];
  let minDist = Infinity;
  Object.keys(lastPositions).forEach(id=>{
    if(id === trackerId) return; // jamais s'auto-alerter (ex: ancien rôle traqueur pas encore écrasé)
    const t = lastPositions[id];
    if((t.role || 'traqueur') !== 'traqueur') return;
    const d = haversine(myPos, [t.lat, t.lng]);
    if(d < minDist) minDist = d;
  });
  const inRange = minDist < PROXIMITY_ALERT_DISTANCE;
  if(inRange && !proximityAlertActive){
    speak('Attention. Les traqueurs sont à moins de 100 mètres.');
  }
  setProximityAlert(inRange);
}

function setProximityAlert(active){
  proximityAlertActive = active;
  let el = document.getElementById('proximityAlert');
  if(active){
    if(!el){
      el = document.createElement('div');
      el.id = 'proximityAlert';
      el.className = 'proximity-alert';
      el.textContent = '⚠ TRAQUEUR À MOINS DE 100 M ⚠';
      document.body.appendChild(el);
    }
  } else if(el){
    el.remove();
  }
}

function ageSeconds(ts){ return Math.floor((Date.now() - ts) / 1000); }

function statusOf(ts, role){
  role = (role === 'poste') ? 'poste' : 'traqueur';
  const age = ageSeconds(ts);
  if(age > DEAD_AFTER[role]) return 'dead';
  if(age > STALE_AFTER[role]) return 'stale';
  return 'live';
}

function fmtAge(ts){
  const age = ageSeconds(ts);
  if(age < 60) return `il y a ${age}s`;
  return `il y a ${Math.floor(age/60)} min`;
}

}

function renderTraqueurPanel(data){
  const summaryEl = document.getElementById('tpSummary');
  const bodyEl = document.getElementById('tpBody');
  if(!summaryEl || !bodyEl) return;

  const ids = Object.keys(data);
  if(ids.length === 0){
    summaryEl.textContent = 'Personne ne partage sa position';
    bodyEl.innerHTML = `<div class="tp-row"><div class="tp-meta" style="text-align:left">Personne ne partage sa position pour le moment.</div></div>`;
    return;
  }
  const traqueurIds = ids.filter(id => (data[id].role || 'traqueur') === 'traqueur');
  const posteIds = ids.filter(id => data[id].role === 'poste');

  const statusList = ids.map(id => statusOf(data[id].timestamp, data[id].role === 'poste' ? 'poste' : 'traqueur'));
  const warn = statusList.includes('dead') ? ' ⚠' : (statusList.includes('stale') ? ' •' : '');

  summaryEl.textContent = `🎯 ${traqueurIds.length} traqueur${traqueurIds.length>1?'s':''} · 📍 ${posteIds.length} posté${posteIds.length>1?'s':''}${warn}`;

  let html = '';
  if(traqueurIds.length){
    html += `<div class="tp-section-label">🎯 Traqueur${traqueurIds.length>1?'s':''}</div>`;
    html += traqueurIds.map(id=>renderTpRow(id, data[id], true)).join('');
  }
  if(posteIds.length){
    html += `<div class="tp-section-label">📍 Postés</div>`;
    html += posteIds.map(id=>renderTpRow(id, data[id], false)).join('');
  }
  bodyEl.innerHTML = html;
}

function renderTpRow(id, t, showTrace){
  const role = t.role === 'poste' ? 'poste' : 'traqueur';
  const st = statusOf(t.timestamp, role);
  const label = st === 'live' ? 'En direct' : st === 'stale' ? 'Signal ancien' : 'Perdu';
  const dist = showTrace ? traceDistance(id) : '';
  return `
    <div class="tp-row">
      <div class="tp-row-top">
        <div class="tp-name"><span class="tp-dot ${st==='live'?'':st}"></span>${t.nom || (role==='traqueur'?'Traqueur':'Posté')}</div>
        <div class="tp-meta">${label} · ${fmtAge(t.timestamp)}<br>±${Math.round(t.accuracy)} m</div>
      </div>
      ${showTrace ? `
      <div class="tp-row-bottom">
        <span class="tp-dist mono">${dist ? '📍 ' + dist + ' parcourus' : ''}</span>
        <button class="tp-trace-btn" onclick="loadFullTrace('${id}')">Trace complète</button>
      </div>` : ''}
    </div>
  `;
}

let photosCache = {}; // prénom normalisé -> data URL, alimenté depuis la feuille "Photos"

function refreshPhotosCache(){
  fetch(`${SCRIPT_URL}?photos=1&_t=${Date.now()}`, { cache:'no-store' })
    .then(r=>r.json())
    .then(photos=>{ photosCache = photos || {}; })
    .catch(err=>console.warn('photos fetch error', err));
}

  }
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=> showPhotoCropModal(nomForPhoto.trim(), img);
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function showPhotoCropModal(nomForPhoto, img){
  closePhotoModal();

  const overlay = document.createElement('div');
  overlay.className = 'photo-modal-overlay';
  overlay.id = 'photoModalOverlay';
  overlay.innerHTML = `
    <div class="photo-modal">
      <div class="photo-modal-title">Photo de ${nomForPhoto}</div>
      <canvas id="photoCropCanvas" width="260" height="260"></canvas>
      <div class="photo-modal-hint">Glisse pour repositionner, molette/curseur pour zoomer</div>
      <input type="range" id="photoZoomRange" min="100" max="300" value="100">
      <div class="photo-modal-actions">
        <button class="photo-modal-btn photo-modal-cancel" onclick="closePhotoModal()">Annuler</button>
        <button class="photo-modal-btn photo-modal-confirm" onclick="confirmPhotoCrop()">✓ Valider</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const canvas = document.getElementById('photoCropCanvas');
  const ctx = canvas.getContext('2d');
  const size = canvas.width; // cadre carré
  const baseScale = Math.max(size / img.width, size / img.height); // "cover" : l'image remplit le cadre

  photoModalState = {
    nomForPhoto, img, canvas, ctx, size, baseScale, zoom: 1,
    offsetX: (size - img.width * baseScale) / 2,
    offsetY: (size - img.height * baseScale) / 2,
    dragging: false, lastX: 0, lastY: 0
  };

  redrawPhotoCrop();

  document.getElementById('photoZoomRange').addEventListener('input', e=>{
    const st = photoModalState;
    if(!st) return;
    const cx = st.size / 2, cy = st.size / 2;
    const imgCxBefore = (cx - st.offsetX) / (st.baseScale * st.zoom);
    const imgCyBefore = (cy - st.offsetY) / (st.baseScale * st.zoom);
    st.zoom = e.target.value / 100;
    st.offsetX = cx - imgCxBefore * st.baseScale * st.zoom;
    st.offsetY = cy - imgCyBefore * st.baseScale * st.zoom;
    redrawPhotoCrop();
  });

  const startDrag = (x,y)=>{ if(photoModalState){ photoModalState.dragging = true; photoModalState.lastX = x; photoModalState.lastY = y; } };
  const moveDrag = (x,y)=>{
    const st = photoModalState;
    if(!st || !st.dragging) return;
    st.offsetX += (x - st.lastX);
    st.offsetY += (y - st.lastY);
    st.lastX = x; st.lastY = y;
    redrawPhotoCrop();
  };
  const endDrag = ()=>{ if(photoModalState) photoModalState.dragging = false; };

  canvas.addEventListener('mousedown', e=>startDrag(e.clientX, e.clientY));
  window.addEventListener('mousemove', e=>moveDrag(e.clientX, e.clientY));
  window.addEventListener('mouseup', endDrag);
  canvas.addEventListener('touchstart', e=>{ const t=e.touches[0]; startDrag(t.clientX, t.clientY); }, {passive:true});
  canvas.addEventListener('touchmove', e=>{ const t=e.touches[0]; moveDrag(t.clientX, t.clientY); e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchend', endDrag);
}

function redrawPhotoCrop(){
  const st = photoModalState;
  if(!st) return;
  st.ctx.clearRect(0, 0, st.size, st.size);
  st.ctx.save();
  st.ctx.translate(st.offsetX, st.offsetY);
  st.ctx.scale(st.baseScale * st.zoom, st.baseScale * st.zoom);
  st.ctx.drawImage(st.img, 0, 0);
  st.ctx.restore();
}

function confirmPhotoCrop(){
  const st = photoModalState;
  if(!st) return;

  const outSize = 200; // photo finale compacte, légère à stocker/transmettre
  const outCanvas = document.createElement('canvas');
  outCanvas.width = outSize; outCanvas.height = outSize;
  const outCtx = outCanvas.getContext('2d');
  const ratio = outSize / st.size;
  outCtx.save();
  outCtx.translate(st.offsetX * ratio, st.offsetY * ratio);
  outCtx.scale(st.baseScale * st.zoom * ratio, st.baseScale * st.zoom * ratio);
  outCtx.drawImage(st.img, 0, 0);
  outCtx.restore();
  const dataUrl = outCanvas.toDataURL('image/jpeg', 0.75);
  const nomForPhoto = st.nomForPhoto;

  fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'photoUpdate', nom: nomForPhoto, photo: dataUrl }) })
    .then(r=>r.json())
    .then(res=>{
      if(res && res.ok){
        photosCache[normalizeName(nomForPhoto)] = dataUrl;
        renderBriefingPresenceSection();
      } else {
        alert('La photo n\'a pas pu être enregistrée (trop volumineuse ?). Essaie une photo moins détaillée.');
      }
    })
    .catch(()=>alert('Erreur lors de l\'enregistrement de la photo.'));

  closePhotoModal();
}

function closePhotoModal(){
  const overlay = document.getElementById('photoModalOverlay');
  if(overlay) overlay.remove();
  photoModalState = null;
}

function participantPopupHtml(nom, hint){
  const key = normalizeName(nom);
  const photo = photosCache[key] || PARTICIPANT_PHOTOS[key];
  if(photo){
    return `<div class="participant-popup">
      <img src="${photo}" alt="${nom}">
      <div class="pp-name">${nom}</div>
      ${hint ? `<div class="pp-hint">${hint}</div>` : ''}
    </div>`;
  }
  return `<div class="participant-popup pp-nophoto">
    <div class="pp-avatar">${(nom||'?').trim().slice(0,2).toUpperCase()}</div>
    <div class="pp-name">${nom}</div>
    <div class="pp-hint">${hint || 'Pas encore de photo'}</div>
  </div>`;
}

function renderMarkers(data){
  const ids = Object.keys(data);
  // supprime les marqueurs des traqueurs qui ne sont plus dans la réponse (stop)
  Object.keys(markers).forEach(id=>{
    if(!ids.includes(id)){ map.removeLayer(markers[id]); delete markers[id]; }
  });

  ids.forEach(id=>{
    const t = data[id];
    const role = t.role === 'poste' ? 'poste' : 'traqueur';
    const st = statusOf(t.timestamp, role);
    const shapeClass = role === 'poste' ? 'marker-poste' : '';
    const shapeStyle = role === 'poste' ? 'border-radius:6px;' : '';
    const blinkClass = (role === 'traqueur' && st === 'live') ? 'marker-blink' : '';
    const initials = (t.nom || '?').trim().slice(0, 2).toUpperCase();
    const isAthena = role === 'traqueur' && normalizeName(t.nom) === ATHENA_NAME_NORM;
    let athenaSpeedClass = '';
    if(isAthena && st === 'live'){
      const speedKmh = athenaSpeedKmh(t.lat, t.lng, t.timestamp);
      if(speedKmh === null) athenaSpeedClass = 'marker-blink'; // pas encore de vitesse connue : halo neutre par défaut
      else if(speedKmh < 5) athenaSpeedClass = 'speed-slow';
      else if(speedKmh < 10) athenaSpeedClass = 'speed-mid';
      else athenaSpeedClass = 'speed-fast';
    }
    const icon = isAthena
      ? L.divIcon({
          className:'',
          html:`<div class="marker-athena ${athenaSpeedClass} ${st==='live'?'':st}"><img src="${ATHENA_ICON_B64}" alt="Athéna"></div>`,
          iconSize:[38,38], iconAnchor:[19,19]
        })
      : L.divIcon({
          className:'',
          html:`<div class="marker-live ${shapeClass} ${blinkClass} ${st==='live'?'':st}" style="${shapeStyle}">${initials}</div>`,
          iconSize:[28,28], iconAnchor:[14,14]
        });
    const latlng = [t.lat, t.lng];
    if(role === 'traqueur') updateTrace(id, latlng, t.timestamp);
    if(markers[id]){
      markers[id].setLatLng(latlng);
      markers[id].setIcon(icon);
    } else {
      markers[id] = L.marker(latlng, { icon }).addTo(map);
    }
    markers[id].bindTooltip(`${t.nom || (role==='traqueur'?'Traqueur':'Posté')} — ${fmtAge(t.timestamp)}`, { direction:'top', offset:[0,-14] });
    markers[id].bindPopup(participantPopupHtml(t.nom || (role==='traqueur'?'Traqueur':'Posté')), { className:'participant-popup-wrap', closeButton:true });
  });
}

// Affiche sur la carte les postes assignés au briefing du matin dont le chasseur ne s'est
// pas encore enregistré en direct. Dès que ce chasseur s'enregistre (même prénom, normalisé),
// sa position réelle prend le dessus et le pion d'assignation statique disparaît.
function renderAssignedMarkers(data){
  if(!map) return;
  const postes = (typeof HUNT_DATA !== 'undefined' && HUNT_DATA.postes) ? HUNT_DATA.postes : [];
  if(!postes.length) return;

  const posteById = {};
  postes.forEach(p=>{ posteById[posteIdOf(p)] = p; });

  const liveNames = new Set(
    Object.values(data)
      .filter(t=>t.role === 'poste')
      .map(t=>normalizeName(t.nom))
  );

  const wanted = new Set();
  Object.keys(briefingCache).forEach(posteId=>{
    const state = briefingCache[posteId];
    if(!state || !state.actif || !state.chasseur) return;
    if(liveNames.has(normalizeName(state.chasseur))) return; // enregistrement en direct prioritaire
    const p = posteById[posteId];
    if(!p) return;
    wanted.add(posteId);

    const initials = state.chasseur.trim().slice(0,2).toUpperCase();
    const icon = L.divIcon({
      className:'',
      html:`<div class="marker-assigned">${initials}</div>`,
      iconSize:[26,26], iconAnchor:[13,13]
    });
    const latlng = [p.lat, p.lng];
    if(assignedMarkers[posteId]){
      assignedMarkers[posteId].setLatLng(latlng);
    } else {
      assignedMarkers[posteId] = L.marker(latlng, { icon }).addTo(map);
    }
    assignedMarkers[posteId].bindTooltip(`${state.chasseur} — assigné au poste ${p.name}`, { direction:'top', offset:[0,-14] });
    assignedMarkers[posteId].bindPopup(participantPopupHtml(state.chasseur, `Poste assigné : ${p.name} — pas encore enregistré`), { className:'participant-popup-wrap', closeButton:true });
  });

  Object.keys(assignedMarkers).forEach(posteId=>{
    if(!wanted.has(posteId)){
      map.removeLayer(assignedMarkers[posteId]);
      delete assignedMarkers[posteId];
    }
  });
}

  renderSelect();
